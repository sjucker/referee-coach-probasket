<app-header></app-header>
<app-loading-bar [show]="loading()"></app-loading-bar>

<mat-card appearance="outlined">
    <mat-card-content>
        @if (error()) {
            <div class="error">{{ error() }}</div>
        }

        <div class="search-container">
            <mat-form-field appearance="fill" class="search-field">
                <input matInput placeholder="Search by name" [ngModel]="textFilter()" (ngModelChange)="textFilter.set($event)"/>
            </mat-form-field>

            <button mat-flat-button color="primary" (click)="addTag()">
                <mat-icon>add</mat-icon>
                Add Tag
            </button>
        </div>

        <div class="table-container" [class.loading]="loading()">
            <table mat-table [dataSource]="filteredTags()">

                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef>Name</th>
                    <td mat-cell *matCellDef="let t">{{ t.name }}</td>
                </ng-container>

                <ng-container matColumnDef="usageCount">
                    <th mat-header-cell *matHeaderCellDef matTooltip="Number of video comments using this tag">Usages</th>
                    <td mat-cell *matCellDef="let t">{{ t.usageCount }}</td>
                </ng-container>

                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef></th>
                    <td mat-cell *matCellDef="let t">
                        <button mat-icon-button (click)="renameTag(t)" matTooltip="Rename">
                            <mat-icon>edit</mat-icon>
                        </button>
                        <button mat-icon-button (click)="deleteTag(t)" [disabled]="t.usageCount > 0"
                                [matTooltip]="t.usageCount > 0 ? 'Tag is in use and cannot be deleted' : 'Delete'">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
            </table>
        </div>
    </mat-card-content>
</mat-card>
